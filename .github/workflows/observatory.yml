# Measures the public tclk board and commits the result.
#
# The measurement runs here, on GitHub's runners, rather than on a private machine. That is
# deliberate: it needs no secret, it reads a public room anonymously, and anyone can re-run this
# workflow from a fork and compare their numbers to ours. A figure nobody else can reproduce is
# not a measurement.
#
# The read takes a few minutes: every signature in the export ring is verified with Ed25519,
# and the ring holds roughly twelve thousand signed frames.

name: observatory

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the hour so the runner queue is quieter
  workflow_dispatch:        # anyone can trigger it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "deals/observatory.mjs"
      - "deals/signing_public.mjs"
      - "docs/index.html"
      - ".github/workflows/observatory.yml"

permissions:
  contents: write

concurrency:
  group: observatory
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The official tclk decoder decides which frames count as commerce, so it is installed here too.
      - name: Install the protocol and crypto libraries
        working-directory: deals
        run: npm ci --omit=dev --no-audit --no-fund || npm install --omit=dev --no-audit --no-fund

      - name: Self-test before trusting the script
        run: node deals/observatory.mjs selftest

      - name: Measure the board
        run: node deals/observatory.mjs

      - name: Refuse to publish a rate above 100%
        run: |
          node -e '
            const d = require("./docs/data.json");
            const bad = [];
            (function walk(o, path) {
              if (o && typeof o === "object") { for (const k of Object.keys(o)) walk(o[k], path + "/" + k); }
              else if (typeof o === "number" && path.includes("part_") && o > 100) bad.push(path + " = " + o);
            })(d, "");
            if (bad.length) { console.error("impossible rate:\n  " + bad.join("\n  ")); process.exit(1); }
            if (!d.signatures || !d.signatures.trames_signees) { console.error("empty measurement, refusing to publish"); process.exit(1); }
            console.log("sanity ok: " + d.signatures.trames_signees + " signed frames, no rate above 100%");
          '

      - name: Refuse to shorten the series
        run: |
          node -e '
            const fs = require("fs");
            const now = JSON.parse(fs.readFileSync("docs/history.json", "utf8"));
            const before = require("child_process").execSync("git show HEAD:docs/history.json", { encoding: "utf8" });
            const was = JSON.parse(before || "[]");
            if (now.length < was.length) {
              console.error("the series lost points: " + was.length + " -> " + now.length + ", refusing to publish");
              process.exit(1);
            }
            console.log("series ok: " + was.length + " -> " + now.length + " points");
          ' || { echo "no series in HEAD yet, first run"; }

      - name: Commit if the numbers moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The series must be committed too, or it never grows: each run starts from a fresh
          # checkout, so what is not pushed is lost at the end of the job.
          if git diff --quiet -- docs/data.json docs/history.json; then
            echo "board unchanged since last run, nothing to commit"
            exit 0
          fi
          git add docs/data.json docs/history.json
          git commit -m "observatory: hourly measurement of the tclk board"
          # Someone can push while this measurement runs, and then our push is rejected. A rebase
          # is the wrong tool here: both sides rewrite the whole of data.json and history.json, so
          # git stops on a content conflict it cannot resolve, and the run dies red on something
          # that is not a defect. Measured on 2026-09-10: two runs were created in the same second,
          # one by the push event that this file's own paths trigger and one by a manual dispatch,
          # and the loser failed on exactly that conflict while the winner published fine.
          #
          # So the loser gives up, quietly and on purpose. The export ring only holds about half an
          # hour and a run happens every hour, so a measurement dropped because another run already
          # holds the branch costs nothing and must not page anyone. Exiting 0 here also keeps every
          # guard above honest: nothing is re-measured after them, so nothing escapes them.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git fetch origin main
            ours=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("docs/data.json","utf8")).mesure_le)')
            theirs=$(git show origin/main:docs/data.json > /tmp/theirs.json && node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/theirs.json","utf8")).mesure_le)')
            echo "push rejected. ours=$ours theirs=$theirs"
            if [ -n "$theirs" ]; then
              echo "a concurrent run already holds the branch; dropping this measurement on purpose"
              echo "(the ring covers about half an hour and the next run is at most an hour away)"
              exit 0
            fi
            echo "the remote has no measurement to compare against, retrying the push"
          done
          echo "three pushes rejected without a readable remote measurement"
          exit 1
