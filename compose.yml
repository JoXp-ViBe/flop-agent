x-agent: &agent
  build: .
  image: flop-agent:local
  restart: unless-stopped
  # .env lives on the host, never in the repo: FLOP_SEED comes from a password manager, pasted by the operator
  env_file:
    - .env
    # daily readings: room, note namespace, source name (outside the repo)
    - path: ./brief.env
      required: false
  environment:
    TECHNOCORE_URL: https://technocore.chat
    FLOP_DATA: /app/data
    FLOP_PERIODE: "1800"
  volumes:
    - ./data:/app/data
  mem_limit: 256m
  cpus: 0.5
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true

services:
  # the identity: DID note, mailbox, presence every 30 min (Python)
  flop-agent:
    <<: *agent
    container_name: flop-agent

  # the work: tclk tasks accepted, solved, delivered, revealed (Node, official library).
  # WORKER_DRY_RUN=1 in .env observes without writing anything on the venue.
  flop-worker:
    <<: *agent
    container_name: flop-worker
    command: ["node", "deals/worker.mjs"]
    environment:
      # an `environment` block here REPLACES the anchor's (YAML merge): its three keys are repeated
      TECHNOCORE_URL: https://technocore.chat
      FLOP_DATA: /app/data
      FLOP_PERIODE: "1800"
      # First volume step, 2026-09-10, measured rather than guessed. The 40/h cap was saturated nine
      # hours out of nine while nothing else bound: 253 distinct payers in a day, none of them near the
      # per-payer limit of 20 (five accepts at most), and only 0.9 % of our contracts end in FAIL, so an
      # extra contract is either a PASS or silence, never a loss. A contract takes 283 s at the median,
      # so six in flight cap the throughput at 76/h, which is what produced 1 291 'too many in flight'
      # refusals. Raising one without the other only moves the wall, so both go up together: twelve in
      # flight allow 152/h, the hourly cap sits at 90 to keep margin, and the day is bounded at 2000.
      # Untouched on purpose: the per-payer cap (the programme scores no more than 20 a day), the
      # language-model caps (6/h and 30/day, independent), and the room reserve, since the venue already
      # refuses almost every room we ask for.
      WORKER_MAX_PER_HOUR: "90"
      WORKER_MAX_PER_DAY: "2000"
      WORKER_MAX_ACTIVE: "12"
      # Our mailbox. An offer a payer addresses to us there passes above the hourly cap, which is a pacing
      # knob, never above the daily, per-payer or in-flight caps. Measured 2026-09-10: of 20 offers addressed
      # to us over two days, 2 were accepted, 8 refused by the hourly cap, 10 left no trace at all.
      # Not a secret: the same id is published in our DID note.
      WORKER_MAILBOX: "mb-p-e7f037283e4b66370bf6"

  # the probe responder: answers the venue operator's labelled "probe v1" lines (ask → a canned answer citing
  # the id, offer → a tclk accept) within the 120 s window, one reply per probe, only to the announced key.
  flop-probe:
    <<: *agent
    container_name: flop-probe
    command: ["node", "deals/probe.mjs"]
    environment:
      TECHNOCORE_URL: https://technocore.chat
      FLOP_DATA: /app/data
      FLOP_PERIODE: "1800"
      PROBE_ROOMS: technocore,meta,kibble,lobby

  # the mailbox responder: reads our mailbox continuously and answers questions other agents leave there.
  # A tool-less language model drafts the reply; deals/courrier.mjs then checks it mechanically (every
  # number must come from the facts or the message, links on an allowlist, no promises, plain ASCII)
  # and posts only what passes. Anything doubtful is handed over instead, never posted. At most 6 replies
  # a day and 2 per peer, and a message without a question gets no reply: two automatic responders must
  # not keep a thread alive between themselves. COURRIER_DRY_RUN=1 drafts without posting.
  flop-courrier:
    <<: *agent
    container_name: flop-courrier
    command: ["node", "deals/courrier.mjs"]
    environment:
      TECHNOCORE_URL: https://technocore.chat
      FLOP_DATA: /app/data
      FLOP_PERIODE: "1800"
      COURRIER_MAILBOX: "mb-p-e7f037283e4b66370bf6"

  # the other side of commerce: we post tclk offers (paper rail, no value) whose answers we know in advance,
  # lock as soon as an agent accepts, judge the delivery exactly, and post the receipt + review. Opt-in:
  # `docker compose --profile payer up -d` (rehearse first on a local venue: `node deals/payer.mjs rehearse`).
  flop-payer:
    <<: *agent
    container_name: flop-payer
    command: ["node", "deals/payer.mjs"]
    profiles: ["payer"]
    environment:
      TECHNOCORE_URL: https://technocore.chat
      FLOP_DATA: /app/data
      FLOP_PERIODE: "1800"
      # one deal room per deal on the IP's daily room quota (20): one offer every 72 min, 20 a day
      PAYER_INTERVAL_MS: "4320000"
      PAYER_MAX_PER_DAY: "20"
